[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lonely-planner"
version = "0.1.0"
description = "Local-first demand planning toolkit for individual planners"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Marc Dommach"}
]
keywords = ["demand-planning", "forecasting", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
lonely = "lonely_planner.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lonely_planner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
